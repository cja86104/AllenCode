<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allen Code Co. — Custom Software, Web Design & AI for Real Businesses</title>
    <meta name="description" content="Custom development, web design, UI/UX, and AI integration — built around your business. Tailored work for small business owners and founders." />
    <meta name="theme-color" content="#0a0a0a" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!--
      Static defaults below. The build writes each sitemap page's own title, description,
      canonical, og:* and twitter:* into that page's prebuilt HTML (Phase 9, tools/prerender/html.mjs
      applyHead), so link-preview bots and crawlers that never run JavaScript read the right page.
      usePageMeta.js (src/hooks/usePageMeta.js) keeps them right as the visitor moves between pages.
      These values remain in spa.html, the shell served for every address without a prebuilt page.
    -->
    <link rel="canonical" href="https://www.allencodeco.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Allen Code Co." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Allen Code Co. — Custom Software, Web Design & AI for Real Businesses" />
    <meta property="og:description" content="Custom development, web design, UI/UX, and AI integration — built around your business. Tailored work for small business owners and founders." />
    <meta property="og:url" content="https://www.allencodeco.com/" />
    <meta property="og:image" content="https://www.allencodeco.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Allen Code Co. — We build what you need, for whoever you are." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Allen Code Co. — Custom Software, Web Design & AI for Real Businesses" />
    <meta name="twitter:description" content="Custom development, web design, UI/UX, and AI integration — built around your business. Tailored work for small business owners and founders." />
    <meta name="twitter:image" content="https://www.allencodeco.com/og-image.png" />

    <!--
      Organization JSON-LD. Sitewide, route-invariant facts only (name, url,
      description, logo, founder, contact email). No `sameAs` — Chris has
      real Facebook/GitHub/LinkedIn profiles but their exact URLs aren't
      confirmed here, and listing guessed URLs would misrepresent the
      actual profiles. Add sameAs with the real URLs whenever they're
      confirmed.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Allen Code Co.",
      "url": "https://www.allencodeco.com/",
      "description": "Custom development, web design, UI/UX, and AI integration — built around your business. Tailored work for small business owners and founders.",
      "logo": "https://www.allencodeco.com/logo-512.png",
      "email": "chris@allencodeco.com",
      "founder": {
        "@type": "Person",
        "name": "Chris Allen"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "sales",
        "email": "chris@allencodeco.com",
        "url": "https://cal.com/allencodeco"
      }
    }
    </script>
  </head>
  <body class="bg-[#0a0a0a]">
    <div id="root"></div>
    <!--
      What a reader without JavaScript gets on the shell (spa.html), for addresses without a prebuilt
      page: what the studio is and the way to every page. The prebuilt pages replace this block with
      their real content (Phase 9, tools/prerender/html.mjs injectApp).
    -->
    <noscript>
      <main style="max-width: 40rem; margin: 0 auto; padding: 4rem 1.5rem; color: #f5f5f5; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>Allen Code Co.</h1>
        <p>Custom development, web design, UI/UX, and AI integration — built around your business. Tailored work for small business owners and founders, by Chris Allen.</p>
        <ul>
          <li><a href="/products" style="color: #f97316">Products</a></li>
          <li><a href="/services" style="color: #f97316">Services</a></li>
          <li><a href="/templates" style="color: #f97316">Templates</a></li>
          <li><a href="/about" style="color: #f97316">About</a></li>
          <li><a href="/contact" style="color: #f97316">Contact</a></li>
        </ul>
        <p>This site is built with JavaScript; turn it on to see the full experience, or write to <a href="mailto:chris@allencodeco.com" style="color: #f97316">chris@allencodeco.com</a>.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
